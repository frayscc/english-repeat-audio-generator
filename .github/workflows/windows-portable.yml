name: Build Windows portable

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 portable
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Restore Rust build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify source and offline resources
        shell: pwsh
        run: |
          npm run typecheck
          npm test
          npm run build:v2
          npm run test:v2
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Build portable application
        run: npm run build:windows-portable

      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $executable = Resolve-Path "release-v2/EnglishReader-Windows-x64/EnglishReader.exe"
          $process = Start-Process -FilePath $executable -PassThru
          try {
            Start-Sleep -Seconds 15
            if ($process.HasExited) {
              throw "EnglishReader.exe exited during startup with code $($process.ExitCode)"
            }
            $logPath = Join-Path $env:LOCALAPPDATA "com.englishreader.desktop/logs/English Reader.log"
            if (-not (Test-Path $logPath)) {
              throw "Tauri startup log was not created at $logPath"
            }
            $log = Get-Content $logPath -Raw
            $log
            if ($log -notmatch "checkpoint=session-ready" -or $log -notmatch "checkpoint=phonemizer-ready") {
              throw "Native model or English phonemizer did not become ready"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Create ZIP and checksum
        shell: pwsh
        run: |
          $archive = "release-v2/EnglishReader-Windows-x64.zip"
          Compress-Archive -Path "release-v2/EnglishReader-Windows-x64/*" -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $checksumPath = Join-Path $PWD "release-v2/SHA256SUMS.txt"
          [IO.File]::WriteAllText($checksumPath, "$hash  EnglishReader-Windows-x64.zip`n", [Text.ASCIIEncoding]::new())

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: EnglishReader-Windows-x64
          path: |
            release-v2/EnglishReader-Windows-x64.zip
            release-v2/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
